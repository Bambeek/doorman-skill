<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d">
<title id="t">doorman</title>
<desc id="d">doorman, a Claude Code skill that fetches pages behind Cloudflare and DDoS-Guard walls: it solves the challenge once, keeps the cf_clearance cookie, and walks back in through the cache. An isometric brick wall with its door swung open, light pouring out, a page stepping through the doorway and a cookie labelled cf_clearance beside it.</desc>
